# Course: DevOps Practices and Principles (CSUL511)
# Roll No: 24ESKCS076
# ========================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'cloudtask-devops-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000', 'localhost:3000']
        labels:
          app: 'devops-24eskcs076'
          environment: 'production'
          tier: 'microservice'

  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
