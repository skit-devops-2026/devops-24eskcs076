apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-24eskcs076-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-24eskcs076-service
                port:
                  number: 80
